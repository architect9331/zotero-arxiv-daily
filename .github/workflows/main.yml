name: Send emails daily
on:
  workflow_dispatch:
  schedule:
    # 08:00 Asia/Shanghai
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          python - <<'PY'
          import os
          required = ['ZOTERO_ID', 'ZOTERO_KEY', 'SENDER', 'RECEIVER', 'SENDER_PASSWORD', 'OPENAI_API_KEY', 'OPENAI_API_BASE']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing Actions secrets: ' + ', '.join(missing))
          PY
          if [ -n "$CUSTOM_CONFIG" ]; then
            printf "%s\n" "$CUSTOM_CONFIG" > config/custom.yaml
          fi
          uv run src/zotero_arxiv_daily/main.py
